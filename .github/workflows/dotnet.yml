name: Build and Publish

on:
  push:
    branches:
      - main

jobs:
  # publish all packages
  build-release:
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      id-token: write
      packages: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
          
      - name: Install dependencies
        run: dotnet restore

      - name: NuGet login
        uses: NuGet/login@v1
        id: login_nuget
        with:
          user: kris701

      - name: Set folder
        run: cd DatabaseSharp

      - name: Build and Release [DatabaseSharp]
        run: |  
          cd DatabaseSharp
          dotnet build --configuration Release
          dotnet pack --configuration Release
          dotnet nuget push "DatabaseSharp/bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/kris701/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "DatabaseSharp/bin/Release/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login_nuget.outputs.NUGET_API_KEY }} --skip-duplicate
          cd ..

      - name: Build and Release [DatabaseSharp.SQLServer]
        run: |  
          cd DatabaseSharp.SQLServer
          dotnet build --configuration Release
          dotnet pack --configuration Release
          dotnet nuget push "DatabaseSharp.SQLServer/bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/kris701/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "DatabaseSharp.SQLServer/bin/Release/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login_nuget.outputs.NUGET_API_KEY }} --skip-duplicate
          cd ..

      - name: Build and Release [DatabaseSharp.PostgreSQL]
        run: |  
          cd DatabaseSharp.PostgreSQL
          dotnet build --configuration Release
          dotnet pack --configuration Release
          dotnet nuget push "DatabaseSharp.PostgreSQL/bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/kris701/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "DatabaseSharp.PostgreSQL/bin/Release/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login_nuget.outputs.NUGET_API_KEY }} --skip-duplicate
          cd ..

      - name: Build and Release [DatabaseSharp.MySQL]
        run: |  
          cd DatabaseSharp.MySQL
          dotnet build --configuration Release
          dotnet pack --configuration Release
          dotnet nuget push "DatabaseSharp.MySQL/bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/kris701/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "DatabaseSharp.MySQL/bin/Release/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login_nuget.outputs.NUGET_API_KEY }} --skip-duplicate
          cd ..
